version: '3.8'

services:
  # ============================================
  # StylQ Backend API Service
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stylq_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/smartsalon
      - JWT_SECRET=stylq_super_secret_jwt_key_2026
    depends_on:
      - mongodb
    networks:
      - stylq_network

  # ============================================
  # MongoDB Database Service
  # ============================================
  mongodb:
    image: mongo:6.0
    container_name: stylq_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - stylq_network

# ============================================
# Networks & Persistent Volumes
# ============================================
networks:
  stylq_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
